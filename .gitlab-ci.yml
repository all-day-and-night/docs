stages:
  - build
  - deploy

variables:
  PNPM_VERSION: "9"

.only-main: &only-main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never

build:
  stage: build
  image: node:20
  tags:
    - docker
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
  artifacts:
    paths:
      - .vitepress/dist/
    expire_in: 1 hour
  <<: *only-main

deploy:
  stage: deploy
  image: amazon/aws-cli
  tags:
    - docker
  script:
    - aws s3 sync .vitepress/dist/ s3://$DOCS_S3_BUCKET/ --delete --cache-control "max-age=31536000,public" --exclude "*.html"
    - aws s3 sync .vitepress/dist/ s3://$DOCS_S3_BUCKET/ --cache-control "no-cache" --exclude "*" --include "*.html"
    - aws cloudfront create-invalidation --distribution-id $DOCS_CF_DISTRIBUTION_ID --paths "/*"
  needs:
    - build
  <<: *only-main

